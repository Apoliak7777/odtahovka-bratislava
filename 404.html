<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stránka sa nenašla – Odťahovka Bratislava</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Nunito:wght@600;800&display=swap">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#2457C5;color:#fff;font-family:Nunito,"Helvetica Neue",Arial,sans-serif;text-align:center;padding:24px 16px}
.box{max-width:520px}
img{width:min(50vw,200px);height:auto;filter:drop-shadow(0 16px 22px rgba(11,21,38,.35))}
h1{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:clamp(28px,5vw,44px);letter-spacing:-.02em;margin:18px 0 10px;line-height:1.1}
p{color:#DCE6FF;font-size:17px;margin:0 0 24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:12px;padding:15px 24px;font-weight:800;font-size:16px;text-decoration:none;margin:6px}
.a{background:#F0A500;color:#161200}.b{background:#fff;color:#2457C5}
</style>
</head>
<body>
<div class="box">
  <img src="/assets/berno.svg" alt="Berno" width="420" height="560">
  <h1>Táto stránka sa stratila.<br>Vaše auto nestratíme.</h1>
  <p>Adresa, ktorú ste otvorili, neexistuje. Odťah objednáte na úvodnej stránke alebo telefonicky.</p>
  <a class="btn a" href="tel:+421900000000">Zavolať 0900 000 000</a>
  <a class="btn b" href="/">Na úvodnú stránku</a>
</div>
</body>
</html>
